<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ── Segurança: só permite arquivos do próprio site ──
       Ao ativar Analytics/AdSense (lgpd.js), esta política precisa incluir os domínios do Google. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">

  <link rel="icon" href="litera-icon.png" type="image/png">
  <link rel="apple-touch-icon" href="litera-iphone.png">

  <!-- ── SEO básico ── -->
  <title>Litera</title>
  <meta name="description" content="Transforme seu texto em letras estilizadas Unicode (gótico, cursiva, negrito, itálico) e copie caracteres especiais: estrelas, setas, símbolos e mais. Grátis e sem cadastro.">
  <meta name="robots" content="index, follow">
  <!-- Ative quando o domínio próprio existir (antes disso, apontaria o Google para um endereço inexistente):
  <link rel="canonical" href="https://SEU-DOMINIO.com.br/">
  -->

  <!-- ── Open Graph (WhatsApp, Facebook, LinkedIn) ── -->
  <meta property="og:type"        content="website">
  <!-- <meta property="og:url"     content="https://SEU-DOMINIO.com.br/"> -->
  <meta property="og:title"       content="Litera">
  <meta property="og:description" content="Letras estilizadas Unicode e caracteres especiais para copiar e colar. Grátis e sem cadastro.">
  <meta property="og:locale"      content="pt_BR">

  <!-- ── Twitter Card ── -->
  <meta name="twitter:card"        content="summary">
  <meta name="twitter:title"       content="Litera">
  <meta name="twitter:description" content="Letras estilizadas Unicode e caracteres especiais para copiar e colar. Grátis e sem cadastro.">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <span class="rotulo">// LITERA</span>
  </header>

  <nav class="abas">
    <button class="aba-btn ativa" data-aba="conversor">Conversor de Fontes</button>
    <button class="aba-btn" data-aba="caracteres">Caracteres Especiais</button>
  </nav>

  <main>
    <section id="conversor" class="painel ativo">
      <h1 class="titulo">Transforme seu <em>texto</em>.</h1>

      <div class="bloco">
        <span class="rotulo">// TEXTO</span>
        <textarea id="texto-entrada" class="caixa-texto" placeholder="Escreva aqui..." maxlength="300"></textarea>
      </div>

      <div class="cartoes-fontes" id="cartoes-fontes"></div>

      <div class="bloco">
        <span class="rotulo">// RESULTADO</span>
        <textarea id="texto-resultado" class="caixa-texto" placeholder="O resultado aparece aqui..." readonly></textarea>
      </div>

      <div class="rodape-resultado">
        <div id="opcoes-ativas" class="opcoes-ativas"></div>
        <button id="btn-copiar" class="botao-pill">Copiar resultado</button>
      </div>
    </section>

    <section id="caracteres" class="painel">
  <div id="sentinela-flutuante"></div>
  <div id="barra-selecao" class="barra-selecao">
    <input type="text" id="caixa-selecionados" class="caixa-selecionados"
           placeholder="Clique nos caracteres para adicionar aqui...">
    <button id="btn-copiar-caracteres" class="botao-pill oculto">Copiar</button>
  </div>
  <div id="categorias-caracteres"></div>
</section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <footer>
    <p>&copy; 2026 Litera &nbsp;·&nbsp; <a href="privacidade.html" class="link-rodape">Política de Privacidade</a> &nbsp;·&nbsp; <a href="#" id="lgpd-open" class="link-rodape">Preferências de privacidade</a></p>
  </footer>

  <script src="script.js"></script>
  <script src="lgpd.js"></script>
</body>
</html>
